<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Table + Swiper</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --card: #fff; --text: #1a1d23; --muted: #6b7280; --line: #e5e7eb; --group: #f3f4f6;
    --accent: #4f46e5; --accent-soft: #eef2ff; --on-accent: #fff;
    --dup: #b45309; --dup-soft: #fef3c7; --danger: #dc2626; --danger-soft: #fee2e2;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #171a21; --text: #e6e8ec; --muted: #9aa1ad; --line: #262a33; --group: #1d2129;
      --accent: #818cf8; --accent-soft: #1e1b4b; --on-accent: #0f1115;
      --dup: #fbbf24; --dup-soft: #3a2a0a; --danger: #f87171; --danger-soft: #3b1414;
    }
  }
  html { scroll-padding-top: 160px; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  body:not([data-view="open"]) .open-only, body:not([data-view="closed"]) .closed-only,
  body:not([data-view="swipe"]) .swipe-only, [hidden] { display: none !important; }

  header {
    position: sticky; top: 0; z-index: 2; padding: 16px 24px 10px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; letter-spacing: -.01em; margin: 0 auto 0 0; }
  .views { display: flex; gap: 4px; margin-top: 12px; }
  .views a {
    color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 999px; font-weight: 600;
    transition: background-color .15s, color .15s;
  }
  .views a:hover { color: var(--text); background: var(--group); }
  .views a[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
  .views a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .views .n { font-size: 11px; margin-left: 4px; opacity: .8; }
  .stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .pill { padding: 2px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
  .pill b { color: var(--text); }
  .pill.dup b { color: var(--dup); }
  #status { color: var(--muted); margin-top: 8px; min-height: 1.4em; }
  #status button { margin-left: 6px; }

  button, .check {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
    transition: background-color .15s, border-color .15s, color .15s;
  }
  button:hover, .check:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; pointer-events: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { filter: brightness(1.1); color: var(--on-accent); }
  button.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
  button:focus-visible, .check:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .check { display: inline-flex; align-items: center; gap: 6px; }
  .check input { accent-color: var(--accent); margin: 0; }

  main { padding: 16px 24px 40px; }
  table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: clip; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  th button { all: unset; cursor: pointer; border-radius: 3px; }
  th button:hover { color: var(--text); }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th[data-sort]::after { content: " " attr(data-sort); color: var(--accent); }

  tbody tr:not(.group):hover td { background: var(--accent-soft); }
  td button { padding: 1px 8px; margin-right: 4px; }
  tr.group td { background: var(--group); font-weight: 600; padding-block: 9px; }
  tr.group .count { color: var(--muted); font-weight: 400; margin-left: 6px; }
  tr.dup td:first-child { box-shadow: inset 3px 0 var(--dup); }
  .badge { display: inline-block; min-width: 18px; text-align: center; padding: 1px 7px; border-radius: 999px; background: var(--dup-soft); color: var(--dup); font-weight: 600; font-size: 11px; }
  .fav { width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px; }
  .url { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .muted { color: var(--muted); }
  td.empty { text-align: center; padding: 48px; color: var(--muted); }

  .swipe { max-width: 560px; margin: 4px auto 0; display: grid; gap: 14px; }
  .swipe-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .notice { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); }
  .notice p { margin: 0; flex: 1; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: clip;
    box-shadow: 0 12px 32px -14px rgb(0 0 0 / .3);
    transition: transform .18s ease-in, opacity .18s ease-in;
  }
  .card.in { animation: pop .2s ease-out; }
  .card.out-left { transform: translateX(-120%) rotate(-12deg); opacity: 0; }
  .card.out-right { transform: translateX(120%) rotate(12deg); opacity: 0; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } }
  .card.done { padding: 48px 24px; text-align: center; }
  .og-img { aspect-ratio: 1.91 / 1; background: var(--group); display: grid; place-items: center; }
  .og-img .cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .og-img .big-fav { opacity: .85; }
  .card-body { padding: 16px 18px 18px; display: grid; gap: 6px; }
  .card-site { display: flex; align-items: center; color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .card-site .badge { margin-left: auto; text-transform: none; letter-spacing: 0; }
  .card h2 { font-size: 20px; line-height: 1.25; margin: 0; text-wrap: balance; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .desc { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swipe-actions { display: flex; justify-content: center; gap: 10px; }
  .swipe-actions .big { padding: 10px 22px; font-weight: 600; }
  .hint { text-align: center; color: var(--muted); margin: 0; }
  kbd { font: inherit; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--card); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<body data-view="open">
<header>
  <div class="bar">
    <h1>Tab Table + Swiper</h1>
    <label class="check open-only"><input type="checkbox" id="dupOnly"> Duplicates only</label>
    <button id="import" class="open-only">Import CSV…</button>
    <input type="file" id="file" accept=".csv,.tsv,.txt,text/csv" hidden>
    <button id="export" class="primary open-only">Export CSV</button>
    <button id="reopenAll" class="closed-only">Reopen all</button>
    <button id="clearClosed" class="danger closed-only">Clear list</button>
  </div>
  <nav class="views" role="tablist" aria-label="Views">
    <a href="#" id="tabOpen" role="tab">Open tabs</a>
    <a href="#swipe" id="tabSwipe" role="tab">Swipe</a>
    <a href="#closed" id="tabClosed" role="tab">Recently closed<span class="n" id="closedCount"></span></a>
  </nav>
  <div class="stats open-only" id="summary"></div>
  <div id="status" role="status" aria-live="polite"></div>
</header>
<main>
  <table class="open-only" role="tabpanel" aria-labelledby="tabOpen">
    <colgroup><col style="width:120px"><col style="width:14%"><col style="width:30%"><col><col style="width:80px"><col style="width:72px"></colgroup>
    <thead><tr>
      <th>Actions</th>
      <th data-key="site"><button>Site</button></th>
      <th data-key="title"><button>Page</button></th>
      <th data-key="url"><button>URL</button></th>
      <th data-key="window"><button>Window</button></th>
      <th data-key="copies"><button>Copies</button></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <table class="closed-only" role="tabpanel" aria-labelledby="tabClosed">
    <colgroup><col style="width:150px"><col style="width:35%"><col><col style="width:120px"></colgroup>
    <thead><tr><th>Actions</th><th>Page</th><th>URL</th><th>Closed</th></tr></thead>
    <tbody id="closedRows"></tbody>
  </table>
  <section class="swipe swipe-only" role="tabpanel" aria-labelledby="tabSwipe">
    <div class="notice" id="swipeAccess" hidden>
      <p>Link previews (image, title, description) need permission to load each page.</p>
      <button id="allowPreviews" class="primary">Allow</button>
    </div>
    <div class="swipe-top">
      <span class="pill" id="swipeProgress"></span>
      <span>
        <button id="swipeUndo" disabled aria-keyshortcuts="Z Backspace Meta+Z Control+Z">↶ Undo</button>
        <button id="swipeRestart">Start over</button>
      </span>
    </div>
    <div id="swipeCard" aria-live="polite"></div>
    <div class="swipe-actions" id="swipeActions">
      <button id="swipeClose" class="danger big">← Close</button>
      <button id="swipeGo" class="big">Go to tab</button>
      <button id="swipeKeep" class="primary big">Keep →</button>
    </div>
    <p class="hint"><kbd>←</kbd> close · <kbd>→</kbd> keep · <kbd>Z</kbd> undo</p>
  </section>
</main>
<script src="csv.js"></script>
<script src="tabs.js"></script>
<script src="swipe.js"></script>
</body>
